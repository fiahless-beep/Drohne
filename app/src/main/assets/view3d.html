<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D</title>
<style>
  /* Schriften des Cockpits; View3D.kt liefert sie unter dieser Adresse aus res/font (ohne Netz). Fehlen sie, gilt monospace. */
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("https://appassets.androidplatform.net/font/jetbrains_mono_medium.ttf"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("https://appassets.androidplatform.net/font/jetbrains_mono_bold.ttf"); }
  html, body { margin: 0; height: 100%; background: #05080A; overflow: hidden; touch-action: none; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #marks { pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="marks"></canvas>
<script src="three.min.js"></script>
<script>if (!window.THREE) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
// Höhenansicht (Felix 22.11.2026: „dass ich einen Sense für die Höhe kriege“).
// Zweck: auf einen Blick sehen, wie hoch die Drohne über dem steht, was unter ihr ist (Boden, Bäume, Dächer), und wohin sie als Nächstes fliegt.
// Die Drohne steht immer in der Mitte der freien Fläche. Den Blickwinkel wählt die Seite selbst; es gibt nichts zu schieben.
//   Richtung: fest je Plan, vom Startplatz zum Plan hin (so steht Felix im Feld); die Welt dreht sich im Flug nicht.
//   Neigung: flach genug, dass Höhe als Höhe zu sehen ist; steiler nur, wenn ein Hang den Fußpunkt verdeckt.
//   Abstand: NEAR = Lot füllt gut ein Drittel der Höhe; WIDE = ganzer Plan um die Drohne. Am Boden WIDE, im Flug NEAR.
// Koordinaten: x = Ost (m), y = Höhe über dem Startpunkt (m), z = -Nord (m).
// Android ruft: setScene({r:[[x,y,z,yaw|null,pitch,hold],…], t:{x0,y0,dx,dy,nx,ny,z[],c[]}, b:[{h,g,p:[[x,y],…]}], clear, mar}),
//   setDrone(x, höhe, y, kursGrad, gimbalGrad), setFlying(bool), clearDrone(), cycleCamera() → 'near' | 'wide',
//   setInsets(links, oben, rechts, unten) in CSS-Pixeln: Flächen, die das Cockpit überdeckt.
// WebGL zeichnet nur das Relief. Alles, was man ablesen muss (Lot, Route, Zahlen), liegt als 2D-Zeichnung darüber:
// feste Strichstärken und scharfe Schrift, auch in der Sonne.
const C = { bg: '#05080A', panel: 'rgba(11,16,18,0.90)', line: '#1C262B', accent: '#1EE8B0', dim: '#15826A', text: '#D7E2DC', textDim: '#8A9A93', warn: '#FF7A1A', warnText: '#FFB27A', obst: '#8A9A93' };
const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
const FOV = 24, EL_MIN = 30, EL_MAX = 42;
const gl = document.getElementById('view'), marks = document.getElementById('marks'), g = marks.getContext('2d');
let renderer = null, scene, cam, light, reliefMesh = null, extras = [];
let W = 1, H = 1, inset = { l: 0, t: 0, r: 0, b: 0 };
let terrain = null, route = [], runs = [], lowSeg = [], clearM = 8;
let azimuth = 0, planCenter = null, planRadius = 60;       // azimuth: Blickrichtung als Kurs (0 = nach Norden schauen)
let drone = null, droneTarget = null, heading = 0, flying = false, passed = 0;
let zoomUser = 1, azAuto = 0;                               // Zwei-Finger-Geste: Abstand mal zoomUser; azAuto = von der App gewählte Blickrichtung
let userView = null, view = { x: 0, y: 0, z: 0, d: 400, el: EL_MIN }, snap = true, dirty = true, lastSig = '';

function init() {
  window.addEventListener('resize', resize);
  gestures();
  if (document.fonts && document.fonts.load) { document.fonts.load('700 12px "JetBrains Mono"').then(() => dirty = true, () => {}); document.fonts.load('500 12px "JetBrains Mono"').then(() => dirty = true, () => {}); }
  if (window.THREE) {
    try {
      renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true });
      renderer.setClearColor(0x05080A, 1);
      scene = new THREE.Scene();
      cam = new THREE.PerspectiveCamera(FOV, 1, 5, 9000);
      scene.add(new THREE.AmbientLight(0xffffff, 0.62));
      light = new THREE.DirectionalLight(0xffffff, 0.95); scene.add(light); scene.add(light.target);
    } catch (e) { renderer = null; }
  }
  resize();
  (function loop() { frame(); requestAnimationFrame(loop); })();
}

function resize() {
  W = window.innerWidth || 1; H = window.innerHeight || 1;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  marks.width = Math.round(W * dpr); marks.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (renderer) { renderer.setPixelRatio(Math.min(2, dpr)); renderer.setSize(W, H, false); }

}
function setInsets(l, t, r, b) { inset = { l: l || 0, t: t || 0, r: r || 0, b: b || 0 }; dirty = true; }
/** Freie Fläche (ohne das, was das Cockpit überdeckt); zu klein gerechnete Ränder fallen weg. */
function free() { let x0 = inset.l, y0 = inset.t, x1 = W - inset.r, y1 = H - inset.b; if (x1 - x0 < 160 || y1 - y0 < 120) { x0 = 0; y0 = 0; x1 = W; y1 = H; } return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 }; }

// ---------------------------------------------------------------- Höhenmodell
function cell(arr, i, j) { const t = terrain; i = Math.max(0, Math.min(t.nx - 1, i)); j = Math.max(0, Math.min(t.ny - 1, j)); return arr[j * t.nx + i] || 0; }
/** Geländehöhe unter (x, z) relativ zum Startpunkt; ohne Höhenmodell 0. */
function groundAt(x, z) {
  const t = terrain; if (!t) return 0;
  const fx = (x - t.x0) / t.dx, fy = (-z - t.y0) / t.dy, i = Math.floor(fx), j = Math.floor(fy);
  if (i < 0 || j < 0 || i >= t.nx - 1 || j >= t.ny - 1) return cell(t.z, Math.round(fx), Math.round(fy));
  const u = fx - i, v = fy - j;
  return (cell(t.z, i, j) * (1 - u) + cell(t.z, i + 1, j) * u) * (1 - v) + (cell(t.z, i, j + 1) * (1 - u) + cell(t.z, i + 1, j + 1) * u) * v;
}
/** Höchste Oberfläche (Baum, Dach, sonst Boden) im Umkreis von etwa 3 m: vorsichtig gerechnet, damit die Zahl nicht zu gut aussieht. */
function surfaceAt(x, z) {
  const t = terrain; if (!t) return 0; if (!t.c) return groundAt(x, z);
  const i0 = Math.round((x - t.x0) / t.dx), j0 = Math.round((-z - t.y0) / t.dy), n = Math.max(1, Math.round(3 / t.dx));
  let m = -1e9; for (let j = j0 - n; j <= j0 + n; j++) for (let i = i0 - n; i <= i0 + n; i++) m = Math.max(m, cell(t.z, i, j) + cell(t.c, i, j));
  return Math.max(m, groundAt(x, z));
}

function buildRelief() {
  if (!renderer) return;
  if (reliefMesh) { scene.remove(reliefMesh); reliefMesh.geometry.dispose(); reliefMesh = null; }
  extras.forEach(o => { scene.remove(o); if (o.geometry) o.geometry.dispose(); }); extras = [];
  const t = terrain;
  if (!t) {  // ohne Höhenmodell: Raster auf Starthöhe, damit Lage und Maßstab bleiben
    const grid = new THREE.GridHelper(1200, 24, 0x1C262B, 0x121A1E); scene.add(grid); extras.push(grid); return;
  }
  const geo = new THREE.PlaneGeometry((t.nx - 1) * t.dx, (t.ny - 1) * t.dy, t.nx - 1, t.ny - 1); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
  // Boden dunkel, alles was darauf steht (Baum, Dach) heller, je höher desto heller; zum Rand hin läuft das Modell ins Schwarz aus
  const lo = [0.112, 0.138, 0.150], hi = [0.43, 0.48, 0.49], bg = [0.02, 0.031, 0.039];
  for (let j = 0; j < t.ny; j++) for (let i = 0; i < t.nx; i++) {
    const k = j * t.nx + i, src = (t.ny - 1 - j) * t.nx + i, c = t.c ? (t.c[src] || 0) : 0;
    pos.setY(k, (t.z[src] || 0) + c);
    const a = c < 1.5 ? 0 : Math.min(1, 0.35 + c / 14);
    const edge = Math.min(1, Math.min(i, j, t.nx - 1 - i, t.ny - 1 - j) * t.dx / 45);
    for (let q = 0; q < 3; q++) col[k * 3 + q] = bg[q] + ((lo[q] + (hi[q] - lo[q]) * a) - bg[q]) * edge;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  reliefMesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 0, specular: 0x000000 }));
  reliefMesh.position.set(t.x0 + (t.nx - 1) * t.dx / 2, 0, -(t.y0 + (t.ny - 1) * t.dy / 2));
  scene.add(reliefMesh);
}

/** Gebäude als Klötze: nur ohne Oberflächenmodell (mit Modell stehen die Dächer schon im Relief). Zu nah an der Route = Orange. */
function buildBlocks(list) {
  if (!renderer || !list || !list.length || (terrain && terrain.c)) return;
  const mat = new THREE.MeshPhongMaterial({ color: 0x4d7068, flatShading: true, shininess: 0, specular: 0x000000 });
  const matWarn = new THREE.MeshPhongMaterial({ color: 0xb85a18, flatShading: true, shininess: 0, specular: 0x000000 });
  list.forEach(b => { try {
    const geo = new THREE.ExtrudeGeometry(new THREE.Shape(b.p.map(q => new THREE.Vector2(q[0], q[1]))), { depth: b.h, bevelEnabled: false }); geo.rotateX(-Math.PI / 2); if (b.g) geo.translate(0, b.g, 0);
    const m = new THREE.Mesh(geo, blockNearRoute(b) ? matWarn : mat); scene.add(m); extras.push(m);
  } catch (e) {} });
}
function blockNearRoute(b) {
  const top = b.h + (b.g || 0) + clearM, mar = 8;
  for (let i = 0; i < route.length - 1; i++) { const a = route[i], c = route[i + 1]; if (Math.min(a.y, c.y) >= top) continue;
    for (let k = 0; k <= 12; k++) { const x = a.x + (c.x - a.x) * k / 12, n = -(a.z + (c.z - a.z) * k / 12);
      for (let j = 0; j < b.p.length; j++) { const p = b.p[j], q = b.p[(j + 1) % b.p.length], dx = q[0] - p[0], dy = q[1] - p[1], l = dx * dx + dy * dy, s = l ? Math.max(0, Math.min(1, ((x - p[0]) * dx + (n - p[1]) * dy) / l)) : 0;
        if (Math.hypot(x - p[0] - dx * s, n - p[1] - dy * s) < mar) return true; } } }
  return false;
}

// ---------------------------------------------------------------- Szene
function setScene(D) {
  D = D || {};
  clearM = D.clear || 8;
  terrain = (D.t && D.t.z && D.t.nx > 1 && D.t.ny > 1) ? D.t : null;
  route = (D.r || []).map(p => ({ x: p[0], y: p[2], z: -p[1], photo: (p[5] || 0) > 0 }));
  passed = 0; userView = null; snap = true; dirty = true;
  // Abschnitte gleicher Flughöhe: jeder bekommt eine Höhenmarke (ALT = über dem Startpunkt, wie die Kachel ALT · START)
  runs = [];
  route.forEach((p, i) => { const r = runs[runs.length - 1]; if (r && Math.abs(r.h - p.y) < 0.5) r.to = i; else runs.push({ from: i, to: i, h: p.y }); });
  // Strecken mit weniger als dem Mindestabstand über der Oberfläche: Warnfarbe
  lowSeg = route.map((a, i) => { const b = route[i + 1]; if (!b || !terrain) return false; const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.z - a.z) / 4));
    for (let k = 0; k <= n; k++) { const x = a.x + (b.x - a.x) * k / n, z = a.z + (b.z - a.z) * k / n, y = a.y + (b.y - a.y) * k / n; if (Math.hypot(x, z) > 12 && y - surfaceAt(x, z) < clearM) return true; } return false; });
  // Blickrichtung: vom Startplatz (0,0) zur Mitte des Plans; liegt der Plan um den Start herum, nach Norden
  if (route.length) {
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, y1 = 0; route.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); y1 = Math.max(y1, p.y); });
    planCenter = { x: (x0 + x1) / 2, z: (z0 + z1) / 2, top: y1 };
    planRadius = Math.max(40, route.reduce((m, p) => Math.max(m, Math.hypot(p.x - planCenter.x, p.z - planCenter.z)), Math.hypot(planCenter.x, planCenter.z)));
    azimuth = Math.hypot(planCenter.x, planCenter.z) > 25 ? Math.atan2(planCenter.x, -planCenter.z) : 0;
  } else { planCenter = null; planRadius = 60; azimuth = 0; }
  azAuto = azimuth; zoomUser = 1;
  buildRelief(); buildBlocks(D.b);
  if (light) { const a = azimuth - 0.9; light.position.set(-Math.sin(a) * 300, 420, Math.cos(a) * 300); light.target.position.set(0, 0, 0); }
}

function setFlying(f) { f = !!f; if (f !== flying) { flying = f; userView = null; dirty = true; } }
function setDrone(x, y, n, hdg) {
  const p = { x: x, y: y, z: -n };
  if (!drone || Math.hypot(p.x - drone.x, p.y - drone.y, p.z - drone.z) > 40) { drone = { x: p.x, y: p.y, z: p.z }; if (!droneTarget) snap = true; }
  droneTarget = p; heading = (hdg || 0) * Math.PI / 180; dirty = true;
  // Fortschritt: der früheste noch offene Punkt, an dem die Drohne gerade ist (Start- und Schlusspunkt liegen oft übereinander)
  for (let i = passed; i < route.length; i++) if (Math.hypot(route[i].x - p.x, route[i].y - p.y, route[i].z - p.z) < 4) { passed = i + 1; break; }
}
function clearDrone() { if (drone) { drone = null; droneTarget = null; snap = true; dirty = true; } }
function mode() { return userView || (flying ? 'near' : 'wide'); }
/** Der eine Umschalter: NEAR (Abstand zur Oberfläche ablesen) ↔ WIDE (ganzer Plan). Gilt bis zum nächsten Abheben oder Landen. */
function cycleCamera() { userView = mode() === 'near' ? 'wide' : 'near'; zoomUser = 1; azimuth = azAuto; dirty = true; return userView; }
/**
 * Zwei Finger (Felix 22.11.2026): auseinander und zusammen = näher und weiter, gegeneinander drehen = die Ansicht um die
 * Drohne drehen. Keine Knöpfe dafür. Der Umschalter NEAR/WIDE und ein neuer Plan stellen den Blick der App wieder her.
 */
function gestures() {
  let d0 = 0, a0 = 0;
  const read = t => ({ d: Math.hypot(t[1].clientX - t[0].clientX, t[1].clientY - t[0].clientY), a: Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX) });
  window.addEventListener('touchstart', e => { if (e.touches.length === 2) { const r = read(e.touches); d0 = r.d; a0 = r.a; } e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length !== 2 || d0 <= 0) return;
    const r = read(e.touches);
    if (r.d > 10) zoomUser = Math.max(0.3, Math.min(3.5, zoomUser * d0 / r.d));
    let da = r.a - a0; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
    if (r.d > 40) azimuth -= da;   // Finger dicht beieinander: der Winkel springt, dann nicht drehen
    d0 = r.d; a0 = r.a; dirty = true;
  }, { passive: false });

}
function setFollow() {}

// ---------------------------------------------------------------- Kamera
function eye(v) { const el = v.el * Math.PI / 180, ch = Math.cos(el) * v.d; return { x: v.x - Math.sin(azimuth) * ch, y: v.y + Math.sin(el) * v.d, z: v.z + Math.cos(azimuth) * ch }; }
/** Ist der Fußpunkt von der Kamera aus zu sehen (kein Hang, kein Baum dazwischen)? */
function footVisible(v, foot, margin) {
  const e = eye(v);
  for (let k = 1; k < 48; k++) { const s = k / 48, x = foot.x + (e.x - foot.x) * s, z = foot.z + (e.z - foot.z) * s, y = foot.y + (e.y - foot.y) * s; if (Math.hypot(x - foot.x, z - foot.z) < 6) continue; if (surfaceAt(x, z) + margin > y) return false; }
  return true;
}
/**
 * WIDE: Bildhöhe in Metern, damit alle Punkte ins Bild passen (Kamerarichtung fest, Neigung el). Waagerecht bleibt w
 * (die Drohne) in der Mitte; senkrecht wird w so verschoben, dass der Plan die Höhe füllt statt halb leer zu bleiben.
 */
function spanFor(w, pts, el, aspect) {
  const e = el * Math.PI / 180, rx = Math.cos(azimuth), rz = Math.sin(azimuth), ux = Math.sin(azimuth) * Math.sin(e), uy = Math.cos(e), uz = -Math.cos(azimuth) * Math.sin(e);
  let sx = 0, lo = 1e9, hi = -1e9; pts.forEach(p => { const dx = p.x - w.x, dy = p.y - w.y, dz = p.z - w.z, v = dx * ux + dy * uy + dz * uz; sx = Math.max(sx, Math.abs(dx * rx + dz * rz)); lo = Math.min(lo, v); hi = Math.max(hi, v); });
  const mid = (lo + hi) / 2; w.x += ux * mid; w.y += uy * mid; w.z += uz * mid;
  return Math.max(hi - lo, 2 * sx / aspect) * 1.2 + 16;

/** Bildhöhe in Metern, bei der Punkt p um die feste Mitte w herum noch mit Rand im Bild liegt. */
function reachFor(w, p, el, aspect) {
  const e = el * Math.PI / 180, dx = p.x - w.x, dy = p.y - w.y, dz = p.z - w.z;
  const sx = Math.abs(dx * Math.cos(azimuth) + dz * Math.sin(azimuth)), sy = Math.abs(dx * Math.sin(azimuth) * Math.sin(e) + dy * Math.cos(e) - dz * Math.cos(azimuth) * Math.sin(e));
  return Math.max(2 * sy, 2 * sx / aspect) * 1.25 + 10;
}
function planPoints() { const pts = route.slice(); pts.push({ x: 0, y: groundAt(0, 0), z: 0 }); runs.forEach(r => { const p = route[r.from]; pts.push({ x: p.x, y: surfaceAt(p.x, p.z), z: p.z }); }); return pts; }
function wantView() {
  const f = free(), tanHalf = Math.tan(FOV * Math.PI / 360), m = mode();
  let w;
  if (drone) {
    const gy = groundAt(drone.x, drone.z), agl = Math.max(0, drone.y - gy);
    w = { x: drone.x, y: drone.y - agl * 0.36, z: drone.z };
    const pts = planPoints(); pts.push({ x: drone.x, y: gy, z: drone.z }, drone);
    let spanV = m === 'wide' ? Math.max(90, spanFor(w, pts, view.el, f.w / f.h)) : Math.max(74, agl * 0.87 / 0.40);
    // NEAR: der nächste Punkt soll mit ins Bild (bis zum 2,2-Fachen des normalen Ausschnitts), ohne die Drohne zu verschieben
    if (m === 'near' && passed < route.length) spanV = Math.min(spanV * 2.2, Math.max(spanV, reachFor(w, route[passed], view.el, f.w / f.h)));

    w = { x: c.x, y: groundAt(c.x, c.z) + c.top * 0.4, z: c.z };
    w.d = Math.max(90, spanFor(w, planPoints(), view.el, f.w / f.h)) * (H / f.h) / (2 * tanHalf);
    w.foot = { x: c.x, y: groundAt(c.x, c.z), z: c.z };

  let el = EL_MAX;
  for (let e = EL_MIN; e <= EL_MAX; e += 4) { w.el = e; if (footVisible(w, w.foot, e < view.el - 1 ? 4 : 0.5)) { el = e; break; } }

}
function placeCamera() {
  if (drone && droneTarget) { const k = 0.22; drone.x += (droneTarget.x - drone.x) * k; drone.y += (droneTarget.y - drone.y) * k; drone.z += (droneTarget.z - drone.z) * k; }
  const w = wantView();
  if (snap) { view = { x: w.x, y: w.y, z: w.z, d: w.d, el: w.el }; snap = false; }
  else { const k = 0.14, kz = 0.07; view.x += (w.x - view.x) * k; view.y += (w.y - view.y) * k; view.z += (w.z - view.z) * k; view.d += (w.d - view.d) * kz; view.el += (w.el - view.el) * 0.05; }

  const f = free(), e = eye(view);
  cam.aspect = W / H;
  // Bildmitte in die Mitte der freien Fläche legen
  cam.setViewOffset(W, H, W / 2 - f.cx, H / 2 - f.cy, W, H);

}
const tmp = window.THREE ? new THREE.Vector3() : null;
function P(x, y, z) { tmp.set(x, y, z).project(cam); return { x: (tmp.x + 1) / 2 * W, y: (1 - tmp.y) / 2 * H, ok: tmp.z > -1 && tmp.z < 1 }; }

// ---------------------------------------------------------------- Zeichnung über dem Relief
let boxes = [], lastPts = null;
function hits(b) { return boxes.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y); }
function font(weight, px) { g.font = weight + ' ' + px + 'px ' + MONO; }
function seg(a, b, color, width, dash) { if (!a.ok || !b.ok) return; g.strokeStyle = color; g.lineWidth = width; g.setLineDash(dash || []); g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); g.setLineDash([]); }
/** Kleine Marke mit Kasten. ax/ay = Ankerpunkt; side: -1 links davon, 1 rechts davon. Gibt false zurück, wenn kein Platz ist. */
function tag(text, ax, ay, side, color, must, dimTag) {
  font(dimTag ? 500 : 700, 12); const w = Math.ceil(g.measureText(text).width) + 10, h = 19, f = free();
  const b = { x: side < 0 ? ax - w - 7 : ax + 7, y: ay - h / 2, w, h };
  if (b.x < f.x0 + 2 || b.x + b.w > f.x1 - 2 || b.y < f.y0 + 2 || b.y + b.h > f.y1 - 2) { if (!must) return false; b.x = Math.max(f.x0 + 2, Math.min(f.x1 - 2 - w, b.x)); b.y = Math.max(f.y0 + 2, Math.min(f.y1 - 2 - h, b.y)); }
  if (!must && hits(b)) return false;
  boxes.push(b);
  g.fillStyle = C.panel; g.fillRect(b.x, b.y, b.w, b.h); if (!dimTag) { g.strokeStyle = C.line; g.lineWidth = 1; g.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1); }
  g.fillStyle = color; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(text, b.x + 5, b.y + h / 2 + 0.5);
  return true;
}
function m0(v) { return String(Math.round(v)); }

function drawRoute() {
  if (!route.length) return;
  const pts = route.map(p => P(p.x, p.y, p.z));
  // Stützen an den Enden jedes Höhenabschnitts: zeigen, wo die Linie über dem Boden hängt
  runs.forEach(r => [r.from, r.to].forEach((i, n) => { if (n && r.to === r.from) return; const p = route[i]; const foot = P(p.x, surfaceAt(p.x, p.z), p.z); seg(pts[i], foot, 'rgba(21,130,106,0.8)', 2, [3, 5]); if (foot.ok) { g.fillStyle = C.dim; g.fillRect(foot.x - 4, foot.y - 1, 8, 2); } }));
  // geflogen: blass · offen: dünn und gedämpft. Hell ist nur das Stück von der Drohne zum nächsten Punkt (drawNext).
  for (let pass = 0; pass < 2; pass++) for (let i = 0; i < route.length - 1; i++) {
    const done = i + 1 < passed + (drone ? 1 : 0), kind = done ? 0 : 1;
    if (kind !== pass) continue;
    const low = lowSeg[i];
    if (kind === 1) seg(pts[i], pts[i + 1], 'rgba(5,8,10,0.55)', 3.5);
    seg(pts[i], pts[i + 1], low ? (done ? 'rgba(255,122,26,0.4)' : C.warn) : (kind === 0 ? 'rgba(21,130,106,0.45)' : '#17A17F'), kind === 1 ? 1.5 : 1);
  }
  return pts;
}
function drawRunTags(pts) {
  // Höhenmarken der Route = Höhe über dem Startpunkt („START +45 m“), bewusst gedämpft und ohne Rahmen: die große Zahl
  // an der Drohne ist etwas anderes (Abstand nach unten). Beschriftet sind höchstens zwei Abschnitte, der laufende und der
  // nächste; alle weiteren zeigen nur die kleine Marke.
  const cur = Math.max(0, runs.findIndex(r => r.to >= Math.max(0, passed - 1)));
  runs.forEach((r, n) => {
    if (r.to < passed - 1) return;
    const cands = [r.from, r.to, Math.round((r.from + r.to) / 2)].filter(i => pts[i].ok);
    if (!cands.length) return;
    let at = cands[0];
    if (n === cur || n === cur + 1) { const t = 'START +' + m0(r.h) + ' m';
      for (const i of cands) { const p = pts[i]; if (tag(t, p.x, p.y - 13, -1, C.textDim, false, true) || tag(t, p.x, p.y - 13, 1, C.textDim, false, true)) { at = i; break; } } }
    g.fillStyle = C.textDim; g.fillRect(pts[at].x - 2.5, pts[at].y - 2.5, 5, 5);
  });
}
function drawHome() {
  const gy = groundAt(0, 0), h = P(0, gy, 0); if (!h.ok) return;
  g.fillStyle = C.bg; g.strokeStyle = C.text; g.lineWidth = 1.5; g.fillRect(h.x - 9, h.y - 9, 18, 18); g.strokeRect(h.x - 8.5, h.y - 8.5, 17, 17);
  font(700, 12); g.fillStyle = C.text; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('H', h.x, h.y + 0.5);
  boxes.push({ x: h.x - 11, y: h.y - 11, w: 22, h: 22 });
  return h;
}
function drawNext(pts) {
  if (!drone || !route.length) return;
  const d = P(drone.x, drone.y, drone.z);
  if (passed < route.length) {
    const i = passed, p = route[i], q = pts[i]; if (!q.ok) return;
    seg(d, q, 'rgba(5,8,10,0.85)', 6); seg(d, q, C.accent, 3);
    g.strokeStyle = C.accent; g.lineWidth = 2; g.beginPath(); g.moveTo(q.x, q.y - 7); g.lineTo(q.x + 7, q.y); g.lineTo(q.x, q.y + 7); g.lineTo(q.x - 7, q.y); g.closePath(); g.fillStyle = C.bg; g.fill(); g.stroke();
    const dh = p.y - drone.y, overHome = Math.hypot(p.x, p.z) < 4;
    const t = 'NEXT ' + (overHome ? 'HOME ' : '') + (Math.abs(dh) >= 1.5 ? (dh > 0 ? '▲ ' : '▼ ') + m0(Math.abs(dh)) + ' m' : 'LEVEL');
    if (Math.hypot(q.x - d.x, q.y - d.y) > 26) { tag(t, q.x, q.y, q.x >= d.x ? 1 : -1, C.accent, false) || tag(t, q.x, q.y - 16, q.x >= d.x ? -1 : 1, C.accent, false) || tag(t, q.x, q.y + 16, 1, C.accent, true); }
  } else if (flying && Math.hypot(drone.x, drone.z) > 6) {
    // Plan fertig: Heimweg auf der jetzigen Höhe bis über den Startplatz, dann hinunter
    const over = P(0, drone.y, 0), home = P(0, groundAt(0, 0), 0);
    seg(d, over, C.accent, 2, [6, 5]); seg(over, home, C.accent, 2, [6, 5]);
    tag('HOME ' + m0(Math.hypot(drone.x, drone.z)) + ' m', over.x, over.y, over.x >= d.x ? 1 : -1, C.accent, true);
  }
}
/** Drohne mit Lot: das Herzstück. Lot vom Boden bis zur Drohne mit 10-m-Strichen; was darauf steht (Baum, Dach) als graues Stück. */
function drawDrone() {
  if (!drone) return;
  const f = free(), gy = groundAt(drone.x, drone.z), sy = Math.max(gy, surfaceAt(drone.x, drone.z));
  const agl = Math.max(0, drone.y - gy), obst = sy - gy, under = drone.y < sy - 0.5;         // under: Drohne steht tiefer als die Oberfläche daneben (unter Bäumen, neben einer Mauer)
  const hasObst = obst >= 2 && !under, clr = hasObst ? drone.y - sy : agl;
  const nearHome = Math.hypot(drone.x, drone.z) < 15;
  const low = flying && agl > 3 && clr < clearM && (hasObst || !nearHome);
  const col = low ? C.warn : C.accent, d = P(drone.x, drone.y, drone.z), foot = P(drone.x, gy, drone.z), top = P(drone.x, hasObst ? sy : gy, drone.z);
  const mpp = 2 * view.d * Math.tan(FOV * Math.PI / 360) / H;                                  // Meter je Pixel bei der Drohne
  // Fußpunkt: Schatten und Ring auf der Oberfläche
  const ring = (r, fill, stroke, lw) => { g.beginPath(); for (let k = 0; k <= 32; k++) { const a = k / 32 * Math.PI * 2, q = P(drone.x + Math.cos(a) * r, hasObst ? sy : gy, drone.z + Math.sin(a) * r); k ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); } g.closePath(); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } };
  ring(Math.max(3, 12 * mpp), 'rgba(2,4,5,0.6)', col, 1.5);
  if (agl > 1) {
    // Lot: dunkle Unterlage, dann graues Hindernis-Stück und der freie Abstand in Akzentfarbe
    seg(foot, d, 'rgba(5,8,10,0.85)', 6);
    if (hasObst) seg(foot, top, C.obst, 4);
    seg(top, d, col, 2.5);
    const pxPer10 = Math.hypot(d.x - foot.x, d.y - foot.y) / agl * 10;
    font(500, 12); g.textAlign = 'right'; g.textBaseline = 'middle';
    for (let h = 10; h < agl - 2; h += 10) { const q = P(drone.x, gy + h, drone.z); g.fillStyle = h <= obst && hasObst ? C.bg : col; g.fillRect(q.x - 5, q.y - 1, 10, 2);
      if (h % 20 === 0 && pxPer10 >= 11 && Math.hypot(q.x - d.x, q.y - d.y) > 28 && !hits({ x: q.x - 28, y: q.y - 8, w: 20, h: 16 })) { g.fillStyle = C.textDim; g.lineWidth = 3; g.strokeStyle = 'rgba(5,8,10,0.9)'; g.strokeText(String(h), q.x - 9, q.y + 0.5); g.fillText(String(h), q.x - 9, q.y + 0.5); } }
    g.fillStyle = col; g.fillRect(top.x - 8, top.y - 1.5, 16, 3);
  }
  // Drohne: X mit vier Rotoren und Bugstrich, nach Kurs gedreht, feste Größe auf dem Bildschirm
  const s = 11 * mpp, hx = Math.sin(heading), hz = -Math.cos(heading), rx = Math.cos(heading), rz = Math.sin(heading);
  const arm = [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([a, b]) => P(drone.x + (hx * a + rx * b) * s, drone.y, drone.z + (hz * a + rz * b) * s));
  const nose = P(drone.x + hx * s * 1.9, drone.y, drone.z + hz * s * 1.9);
  [['rgba(5,8,10,0.9)', 6], [low ? C.warn : C.text, 2.5]].forEach(([c, w]) => { seg(arm[0], arm[2], c, w); seg(arm[1], arm[3], c, w); seg(d, nose, c, w); });
  arm.forEach(a => { g.beginPath(); g.arc(a.x, a.y, 3.5, 0, Math.PI * 2); g.fillStyle = C.bg; g.fill(); g.strokeStyle = low ? C.warn : C.text; g.lineWidth = 2; g.stroke(); });
  boxes.push({ x: d.x - 20, y: d.y - 16, w: 40, h: 32 });
  if (agl < 1) { tag('ON GROUND', d.x, d.y - 26, 1, C.text, true); return; }
  // Die eine Zahl: Abstand zu dem, was unter der Drohne ist
  const cap = (low ? 'LOW · ' : '') + (!terrain ? 'OVER START LEVEL' : hasObst ? 'OVER TREE / ROOF' : 'OVER GROUND');
  const num = m0(clr), sub = hasObst ? 'TERRAIN BELOW ' + m0(agl) + ' m' : (under ? 'UNDER TREES / NEXT TO WALL' : '');
  font(700, 30); const wn = g.measureText(num).width; font(500, 12); const wc = Math.max(g.measureText(cap).width, sub ? g.measureText(sub).width : 0);
  const bw = Math.ceil(Math.max(wn + 24, wc)) + 16, bh = sub ? 70 : 54;
  // Kasten auf die Seite, auf der die nächste Strecke nicht liegt; passt er dort nicht in die freie Fläche, auf die andere
  const nq = lastPts && passed < route.length ? lastPts[passed] : null;
  let by = (d.y + top.y) / 2 - bh / 2; if (agl < 12) by = d.y - bh - 18;
  by = Math.max(f.y0 + 4, Math.min(f.y1 - bh - 4, by));
  const right = d.x + 30, left = d.x - 30 - bw, fits = x => x >= f.x0 + 4 && x + bw <= f.x1 - 4 && !hits({ x, y: by, w: bw, h: bh });
  const order = nq && nq.ok && nq.x > d.x + 8 ? [left, right] : [right, left];
  let bx = fits(order[0]) ? order[0] : (fits(order[1]) ? order[1] : order[0]);
  bx = Math.max(f.x0 + 4, Math.min(f.x1 - bw - 4, bx));
  boxes.push({ x: bx - 28, y: by - 24, w: bw + 56, h: bh + 48 });           // mit Abstand: Routenmarken stehen nie direkt daneben
  g.fillStyle = low ? 'rgba(42,23,8,0.94)' : C.panel; g.fillRect(bx, by, bw, bh); g.strokeStyle = low ? C.warn : C.line; g.lineWidth = 1; g.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  g.fillStyle = col; g.fillRect(bx, by, 3, bh);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  font(500, 12); g.fillStyle = low ? C.warnText : C.text; g.fillText(cap, bx + 10, by + 17);
  font(700, 30); g.fillStyle = low ? C.warnText : C.accent; g.fillText(num, bx + 10, by + 46);
  font(500, 13); g.fillStyle = C.text; g.fillText('m', bx + 14 + wn, by + 46);
  if (sub) { font(500, 12); g.fillStyle = C.text; g.fillText(sub, bx + 10, by + 63); }
}
/** Oben rechts: wohin Norden zeigt und welche Stufe der Umschalter gerade hat. */
function drawCorner() {
  const f = free(), cx = f.x1 - 24, cy = f.y0 + 26;
  const a = P(view.x, view.y, view.z), b = P(view.x, view.y, view.z - 30), ang = Math.atan2(b.x - a.x, -(b.y - a.y));
  boxes.push({ x: cx - 62, y: cy - 22, w: 86, h: 62 });
  g.fillStyle = C.panel; g.fillRect(cx - 58, cy - 18, 76, 36); g.strokeStyle = C.line; g.lineWidth = 1; g.strokeRect(cx - 57.5, cy - 17.5, 75, 35);
  g.save(); g.translate(cx, cy); g.rotate(ang); g.fillStyle = C.text; g.beginPath(); g.moveTo(0, -13); g.lineTo(6, 8); g.lineTo(0, 4); g.lineTo(-6, 8); g.closePath(); g.fill(); g.restore();
  font(700, 12); g.fillStyle = C.text; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('N', cx - 38, cy + 0.5);
  font(700, 12); g.textAlign = 'right'; g.fillStyle = C.text; g.fillText(mode() === 'near' ? 'NEAR' : 'WIDE', f.x1 - 6, cy + 30);
}
/** Unten links: was die hellen Körper im Relief sind (das Modell kennt nur „etwas steht hier“, nicht Baum oder Dach). */
function drawLegend() {
  if (!terrain || !terrain.c) return;
  const f = free(), x = f.x0 + 8, y = f.y1 - 14;
  font(500, 12); const w = g.measureText('TREES / ROOFS').width + 28;
  g.fillStyle = C.panel; g.fillRect(x - 4, y - 10, w, 20); g.fillStyle = '#7b8788'; g.fillRect(x, y - 5, 10, 10);
  g.fillStyle = C.text; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('TREES / ROOFS', x + 16, y + 0.5);
  boxes.push({ x: x - 4, y: y - 10, w, h: 20 });
}
function note(text) { const f = free(); font(500, 12); g.textAlign = 'center'; g.textBaseline = 'middle'; const w = g.measureText(text).width + 16; g.fillStyle = C.panel; g.fillRect(f.cx - w / 2, f.y1 - 30, w, 20); g.fillStyle = C.text; g.fillText(text, f.cx, f.y1 - 19.5); }

function frame() {
  placeCamera();
  const sig = [view.x, view.y, view.z, view.d, view.el, drone ? drone.x : 0, drone ? drone.y : 0, drone ? drone.z : 0].map(v => v.toFixed(2)).join() + heading.toFixed(2) + passed + mode() + flying;
  if (!dirty && sig === lastSig) return;
  lastSig = sig; dirty = false;
  g.clearRect(0, 0, W, H); boxes = [];
  if (!renderer) { note('3D NOT AVAILABLE ON THIS DEVICE'); return; }
  renderer.render(scene, cam);
  const pts = drawRoute(); lastPts = pts || null;
  drawHome(); drawCorner(); drawLegend();
  if (pts) drawNext(pts);
  drawDrone();
  if (pts) drawRunTags(pts);
  if (!route.length && !drone) note('NO PLAN LOADED');
  else if (!terrain) note('NO HEIGHT MODEL HERE · HEIGHTS REFER TO START LEVEL');
  else if (!drone) note('NO DRONE POSITION');
}
