<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9d6e2; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #3a4652; font: 15px system-ui, sans-serif; background: rgba(255,255,255,.75); padding: 8px 14px; border-radius: 20px; }
  #cam { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); color: #f5f7fa; font: 600 13px system-ui, sans-serif; background: rgba(20,24,30,.6); padding: 6px 12px; border-radius: 16px; pointer-events: none; opacity: 0; transition: opacity .4s; backdrop-filter: blur(8px); }
  #reticle { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 1.5px solid rgba(255,255,255,.7); border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  #reticle:after { content: ""; position: absolute; left: 11px; top: 11px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hint">3D lädt …</div>
<div id="reticle"></div>
<div id="cam"></div>
<script src="three.min.js"></script>
<script>if (!window.THREE) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
// Koordinaten: x = Ost (m), y = Höhe (m), z = -Nord (m), relativ zum Startpunkt.
// Android ruft: setScene({b:[{h,p:[[x,y],…]}], r:[[x,y,z,yaw|null,pitch,hold],…], clear, mar}),
//   setDrone(x, y, z, headingDeg, gimbalPitchDeg), setFlying(bool), cycleCamera(), clearDrone().
// Kamera: 'fpv' = aus der Drohne (Gimbal), 'chase' = hinter/über der Drohne, 'orbit' = frei um den Plan,
//   'preview' = Vorschau-Flug mit virtueller Drohne nach dem Laden (inkl. Drehen und Halten an den Punkten).
const canvas = document.getElementById('view'), hint = document.getElementById('hint'), camLabel = document.getElementById('cam'), reticle = document.getElementById('reticle');
let renderer, scene, cam, sun, drone, rotors = [], camCone, trail, trailPts = [], buildings = [], routeObjs = [], markers = [], droneShadow, droneLine, glow;
let routeTex = null, wallTex = null;
let center = null, theta = -0.7, phi = 0.75, dist = 220;
let camMode = 'orbit', flightMode = 'fpv';           // flightMode: gewünschte Kamera im Flug (fpv | chase)
let chaseDist = 30, chasePitch = 0.4, yawOff = 0, pitchOff = 0, lastTouch = 0;
let heading = 0, smoothHeading = 0, gimbal = -20, smoothGimbal = -20, camPos = null, camLook = null, flying = false;
let preview = null, drag = null, labelTimer = null, passed = 0;
const SKY_TOP = 0x4f86c9, SKY_HORIZON = 0xdfe8f1;

function texCanvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; }

function init() {
  if (!window.THREE) { hint.textContent = 'three.js fehlt (kein Internet beim Build)'; return false; }
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene(); scene.background = new THREE.Color(SKY_HORIZON); scene.fog = new THREE.Fog(SKY_HORIZON, 500, 1600);
  cam = new THREE.PerspectiveCamera(60, 1, 0.5, 6000);
  // Himmel: Kuppel mit Verlauf, Dunst am Horizont
  const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 24, 12), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(SKY_TOP) }, bottom: { value: new THREE.Color(SKY_HORIZON) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.55)), 1.0); }' }));
  sky.renderOrder = -1; scene.add(sky);
  // Licht: Sonne mit weichen Schatten, Himmelslicht, leichtes Gegenlicht
  scene.add(new THREE.HemisphereLight(0xe9f0f7, 0x8a8f94, 0.75));
  sun = new THREE.DirectionalLight(0xfff4e0, 1.05); sun.position.set(260, 420, 180); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.near = 50; sun.shadow.camera.far = 1600; sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.3;
  const sc = sun.shadow.camera; sc.left = sc.bottom = -450; sc.right = sc.top = 450;
  scene.add(sun); scene.add(sun.target);
  const fill = new THREE.DirectionalLight(0xcfe0ff, 0.25); fill.position.set(-300, 200, -200); scene.add(fill);
  // Boden: helle Fläche mit feinem Raster, nimmt Schatten an
  const groundTex = texCanvas(256, 256, g => { g.fillStyle = '#d3d8dc'; g.fillRect(0, 0, 256, 256); g.strokeStyle = 'rgba(90,100,110,0.10)'; g.lineWidth = 2; g.strokeRect(0, 0, 256, 256); g.strokeStyle = 'rgba(90,100,110,0.05)'; g.lineWidth = 1; for (let i = 64; i < 256; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.moveTo(0, i); g.lineTo(256, i); g.stroke(); } });
  groundTex.repeat.set(80, 80);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: 0xffffff, map: groundTex })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  // Fassaden: feine Stockwerkslinien alle 3 m
  wallTex = texCanvas(64, 64, g => { g.fillStyle = '#ece8e1'; g.fillRect(0, 0, 64, 64); g.fillStyle = 'rgba(70,75,80,0.16)'; g.fillRect(0, 60, 64, 2); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0, 0, 64, 1); });
  wallTex.repeat.set(1 / 6, 1 / 3);
  // Route: leuchtendes Band mit laufenden Pfeilen
  routeTex = texCanvas(128, 32, g => { g.fillStyle = '#2f8cff'; g.fillRect(0, 0, 128, 32); g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.moveTo(40, 2); g.lineTo(70, 16); g.lineTo(40, 30); g.lineTo(52, 16); g.closePath(); g.fill(); });
  buildDrone();
  droneLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: 0x2f3b47, transparent: true, opacity: 0.35 })); scene.add(droneLine); droneLine.visible = false;
  droneShadow = new THREE.Mesh(new THREE.CircleGeometry(2.0, 24), new THREE.MeshBasicMaterial({ color: 0x1b2430, transparent: true, opacity: 0.25 })); droneShadow.rotation.x = -Math.PI / 2; droneShadow.position.y = 0.12; scene.add(droneShadow); droneShadow.visible = false;
  trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xff9f0a })); scene.add(trail);

  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; canvas.setPointerCapture(e.pointerId); lastTouch = performance.now(); });
  canvas.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id) return; const dx = (e.clientX - drag.x) * 0.006, dy = (e.clientY - drag.y) * 0.006; drag.x = e.clientX; drag.y = e.clientY; lastTouch = performance.now();
    if (camMode === 'orbit') { theta -= dx; phi = Math.max(0.08, Math.min(1.5, phi + dy)); } else { yawOff -= dx; pitchOff = Math.max(-0.6, Math.min(0.8, pitchOff + dy)); } });
  canvas.addEventListener('pointerup', () => drag = null);
  canvas.addEventListener('wheel', e => { e.preventDefault(); zoom(1 + e.deltaY * 0.001); }, { passive: false });
  let pinch = null;
  canvas.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
  canvas.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); zoom(pinch / d); pinch = d; drag = null; } }, { passive: true });
  canvas.addEventListener('touchend', () => pinch = null);
  window.addEventListener('resize', resize); resize();
  hint.textContent = 'Kein Plan – Karte zeigt nur die Umgebung';
  (function loop() { tick(); place(); renderer.render(scene, cam); requestAnimationFrame(loop); })();
  return true;
}

// Drohne nach Art der Mini 4 Pro: hellgrauer Rumpf, dunkle Arme, vier drehende Rotoren, Gimbalkamera vorn, Sichtkegel
function buildDrone() {
  drone = new THREE.Group();
  const grey = new THREE.MeshLambertMaterial({ color: 0xe6e8ea }), dark = new THREE.MeshLambertMaterial({ color: 0x3a3f45 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 2.6), grey); body.castShadow = true; drone.add(body);
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.35, 1.6), grey); top.position.set(0, 0.5, -0.1); drone.add(top);
  const camHead = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 10), dark); camHead.position.set(0, -0.15, -1.45); drone.add(camHead);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.25, 12), new THREE.MeshBasicMaterial({ color: 0x1b6cff })); lens.rotation.x = Math.PI / 2; lens.position.set(0, -0.15, -1.9); drone.add(lens);
  [[-1.6, -1.5], [1.6, -1.5], [-1.6, 1.5], [1.6, 1.5]].forEach(([x, z]) => {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x) + 0.4, 0.22, 0.32), dark); arm.position.set(x / 2, 0.05, z * 0.9); drone.add(arm);
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.35, 10), dark); motor.position.set(x, 0.25, z); drone.add(motor);
    const rotor = new THREE.Mesh(new THREE.CircleGeometry(1.0, 24), new THREE.MeshBasicMaterial({ color: 0xd7dbe0, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false })); rotor.rotation.x = -Math.PI / 2; rotor.position.set(x, 0.45, z); drone.add(rotor);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.03, 0.14), dark); blade.position.set(x, 0.46, z); drone.add(blade); rotors.push(blade);
    const light = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), new THREE.MeshBasicMaterial({ color: z < 0 ? 0xff453a : 0x30d158 })); light.position.set(x, 0.0, z + (z < 0 ? -0.2 : 0.2)); drone.add(light);
  });
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 2, 32, 32, 32); gr.addColorStop(0, 'rgba(255,159,10,0.55)'); gr.addColorStop(0.5, 'rgba(255,159,10,0.15)'); gr.addColorStop(1, 'rgba(255,159,10,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })); glow.scale.set(10, 10, 1); drone.add(glow);
  // Sichtkegel der Kamera (dreht mit dem Gimbal)
  camCone = new THREE.Mesh(new THREE.ConeGeometry(9, 28, 4, 1, true), new THREE.MeshBasicMaterial({ color: 0x2f8cff, transparent: true, opacity: 0.10, side: THREE.DoubleSide, depthWrite: false }));
  camCone.geometry.rotateX(Math.PI / 2); camCone.geometry.rotateZ(Math.PI / 4); camCone.geometry.translate(0, 0, -14);
  camCone.position.set(0, -0.15, -1.5); drone.add(camCone);
  scene.add(drone); drone.visible = false;
}

function isFpv() { return camMode === 'fpv' || (camMode === 'preview' && flightMode === 'fpv'); }
function zoom(f) {
  if (camMode === 'orbit') dist = Math.max(20, Math.min(2000, dist * f));
  else if (isFpv()) { cam.fov = Math.max(25, Math.min(100, cam.fov * f)); cam.updateProjectionMatrix(); }
  else chaseDist = Math.max(6, Math.min(300, chaseDist * f));
}
function resize() { const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight; renderer.setSize(w, h, false); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); cam.aspect = w / h; cam.updateProjectionMatrix(); }
function showLabel(t) { camLabel.textContent = t; camLabel.style.opacity = 1; clearTimeout(labelTimer); labelTimer = setTimeout(() => camLabel.style.opacity = 0, 2200); }
function angDiff(a, b) { return ((a - b + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; }
function fwd(yaw) { return new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw)); }

// Glättung von Kurs und Gimbal (auch für die Vorschau), Rotoren, laufende Route, Markierungen nahe der Kamera ausblenden
function tick() {
  if (preview) previewStep();
  smoothHeading += angDiff(heading, smoothHeading) * 0.08;
  smoothGimbal += (gimbal - smoothGimbal) * 0.08;
  if (performance.now() - lastTouch > 4000) { yawOff *= 0.95; pitchOff *= 0.95; }
  const fpvNow = isFpv();
  if (drone.visible) {
    drone.rotation.y = -smoothHeading;
    const sc = camMode === 'orbit' ? Math.max(1, dist / 70) : 1.0; drone.scale.set(sc, sc, sc);
    rotors.forEach((r, i) => r.rotation.y += (i % 2 ? 0.9 : -0.9));
    camCone.rotation.x = THREE.MathUtils.degToRad(smoothGimbal);
    camCone.visible = !fpvNow;
    glow.visible = camMode === 'orbit';
  }
  if (routeTex) routeTex.offset.x -= 0.012;
  markers.forEach(m => { m.visible = !(fpvNow && m.position.distanceTo(cam.position) < 6); });
  reticle.style.display = (fpvNow && drone.visible) ? 'block' : 'none';
}

function place() {
  let target, look;
  const mode = camMode === 'preview' ? flightMode : camMode;
  let k = 0.1;
  if (mode === 'fpv' && drone.visible) {
    const yaw = smoothHeading + yawOff, pitch = THREE.MathUtils.degToRad(smoothGimbal) + pitchOff;
    const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    target = drone.position.clone().add(new THREE.Vector3(0, 0.1, 0)).add(dir.clone().multiplyScalar(1.2));
    look = target.clone().add(dir.multiplyScalar(100));
    k = 0.45;
  } else if (mode === 'chase' && drone.visible) {
    const yaw = smoothHeading + yawOff, pitch = chasePitch + pitchOff;
    target = drone.position.clone().add(fwd(yaw).multiplyScalar(-chaseDist * Math.cos(pitch))).add(new THREE.Vector3(0, chaseDist * Math.sin(pitch), 0));
    look = drone.position.clone().add(fwd(yaw).multiplyScalar(chaseDist * 0.5));
    if (target.y < 2) target.y = 2;
  } else {
    const c = center || new THREE.Vector3(0, 10, 0);
    look = c;
    target = new THREE.Vector3(c.x + dist * Math.cos(phi) * Math.sin(theta), c.y + dist * Math.sin(phi), c.z + dist * Math.cos(phi) * Math.cos(theta));
  }
  if (!camPos) { camPos = target.clone(); camLook = look.clone(); }
  camPos.lerp(target, k); camLook.lerp(look, Math.min(1, k * 1.4));
  cam.position.copy(camPos); cam.lookAt(camLook);
}

function distPointSeg(p, a, b) { const ab = b.clone().sub(a); const l = ab.lengthSq(); const t = l ? Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / l)) : 0; return p.distanceTo(a.clone().add(ab.multiplyScalar(t))); }
function nearRoute(route, poly, h, clear, mar) {
  for (let i = 0; i < route.length - 1; i++) { const a = route[i], b = route[i + 1]; if (Math.min(a.y, b.y) >= h + clear) continue;
    const a2 = new THREE.Vector3(a.x, 0, a.z), b2 = new THREE.Vector3(b.x, 0, b.z);
    for (let k = 0; k <= 20; k++) { const p = a2.clone().lerp(b2, k / 20); for (let j = 0; j < poly.length; j++) { const q1 = new THREE.Vector3(poly[j][0], 0, -poly[j][1]), q2 = new THREE.Vector3(poly[(j + 1) % poly.length][0], 0, -poly[(j + 1) % poly.length][1]); if (distPointSeg(p, q1, q2) < mar) return true; } } }
  return false;
}

function numberSprite(n, color) {
  const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d');
  g.fillStyle = color; g.beginPath(); g.arc(48, 48, 40, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 5; g.stroke();
  g.fillStyle = '#fff'; g.font = 'bold 44px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), 48, 50);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false })); s.scale.set(4.5, 4.5, 1); s.renderOrder = 5; return s;
}

let routeInfo = [];
function setScene(D) {
  if (!scene) return;
  buildings.forEach(o => scene.remove(o)); buildings = []; routeObjs.forEach(o => scene.remove(o)); routeObjs = []; markers = []; passed = 0;
  routeInfo = (D.r || []).map(p => ({ pos: new THREE.Vector3(p[0], p[2], -p[1]), yaw: p[3] == null ? null : THREE.MathUtils.degToRad(p[3]), pitch: p[4] == null ? -20 : p[4], hold: p[5] || 0 }));
  const route = routeInfo.map(r => r.pos);
  const roofMat = new THREE.MeshLambertMaterial({ color: 0xd9d4cc }), wallMat = new THREE.MeshLambertMaterial({ color: 0xffffff, map: wallTex });
  const roofWarn = new THREE.MeshLambertMaterial({ color: 0xe0823a }), wallWarn = new THREE.MeshLambertMaterial({ color: 0xf0a060, map: wallTex });
  (D.b || []).forEach(b => {
    try {
      const shape = new THREE.Shape(b.p.map(q => new THREE.Vector2(q[0], -q[1])));
      const g = new THREE.ExtrudeGeometry(shape, { depth: b.h, bevelEnabled: false }); g.rotateX(-Math.PI / 2);
      const conflict = route.length > 1 && nearRoute(route, b.p, b.h, D.clear || 8, D.mar || 8);
      const m = new THREE.Mesh(g, conflict ? [roofWarn, wallWarn] : [roofMat, wallMat]); m.castShadow = true; m.receiveShadow = true;
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), new THREE.LineBasicMaterial({ color: conflict ? 0xa04a10 : 0x6b7580, transparent: true, opacity: 0.28 }));
      scene.add(m); scene.add(edges); buildings.push(m, edges);
    } catch (e) {}
  });
  if (route.length) {
    try {
      const curve = new THREE.CatmullRomCurve3(route, false, 'catmullrom', 0.0), len = curve.getLength();
      routeTex.repeat.set(Math.max(1, len / 6), 1);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(8, route.length * 12), 0.55, 10, false), new THREE.MeshBasicMaterial({ map: routeTex, side: THREE.FrontSide })); scene.add(tube); routeObjs.push(tube);
      const halo = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(8, route.length * 12), 1.3, 10, false), new THREE.MeshBasicMaterial({ color: 0x2f8cff, transparent: true, opacity: 0.18, side: THREE.FrontSide, depthWrite: false })); scene.add(halo); routeObjs.push(halo);
    } catch (e) {}
    route.forEach((p, i) => {
      const first = i === 0, last = i === route.length - 1;
      const sp = numberSprite(first ? '▲' : (last ? '⌂' : i), (first || last) ? '#30d158' : (routeInfo[i].hold > 0 ? '#ff9f0a' : '#2f8cff'));
      sp.position.set(p.x, p.y + 4, p.z); scene.add(sp); routeObjs.push(sp); markers.push(sp);
      const pole = new THREE.Line(new THREE.BufferGeometry().setFromPoints([p, new THREE.Vector3(p.x, 0, p.z)]), new THREE.LineBasicMaterial({ color: 0x2f8cff, transparent: true, opacity: 0.3 })); scene.add(pole); routeObjs.push(pole);
      const foot = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.6, 20), new THREE.MeshBasicMaterial({ color: 0x2f8cff, transparent: true, opacity: 0.45, side: THREE.DoubleSide })); foot.rotation.x = -Math.PI / 2; foot.position.set(p.x, 0.1, p.z); scene.add(foot); routeObjs.push(foot);
    });
    center = new THREE.Box3().setFromPoints(route).getCenter(new THREE.Vector3()); center.y = 10;
    dist = Math.max(120, route.reduce((m, p) => Math.max(m, p.distanceTo(center)), 0) * 2.2);
    hint.style.display = 'none';
    if (!flying) startPreview();
  } else { center = new THREE.Vector3(0, 10, 0); hint.style.display = ''; }
  sun.target.position.copy(center); sun.position.set(center.x + 260, 420, center.z + 180); sun.shadow.camera.updateProjectionMatrix();
  const homeMark = new THREE.Mesh(new THREE.RingGeometry(2.6, 3.6, 32), new THREE.MeshBasicMaterial({ color: 0x30d158, side: THREE.DoubleSide })); homeMark.rotation.x = -Math.PI / 2; homeMark.position.y = 0.1; scene.add(homeMark); routeObjs.push(homeMark);
  const homeH = new THREE.Mesh(new THREE.CircleGeometry(2.4, 32), new THREE.MeshBasicMaterial({ color: 0x30d158, transparent: true, opacity: 0.25, side: THREE.DoubleSide })); homeH.rotation.x = -Math.PI / 2; homeH.position.y = 0.1; scene.add(homeH); routeObjs.push(homeH);
  trailPts = []; trail.geometry.setFromPoints(trailPts);
}

// Markierung eines erreichten Punkts abblenden
function markPassed(i) { for (; passed <= i && passed < markers.length; passed++) markers[passed].material.opacity = 0.35; }

// ---- Vorschau: virtuelle Drohne fliegt die Route (8 m/s), dreht an Punkten mit Blickrichtung, hält dort kurz
function startPreview() {
  if (routeInfo.length < 2) return;
  preview = { i: 0, t: 0, hold: 0.8, last: performance.now() };
  camMode = 'preview';
  drone.visible = true; drone.position.copy(routeInfo[0].pos); heading = smoothHeading = routeInfo[0].yaw ?? segYaw(0); gimbal = smoothGimbal = -20;
  droneLine.visible = droneShadow.visible = true;
  camPos = null;
  showLabel('Vorschau · Kameraknopf wechselt die Sicht');
}
function segYaw(i) { const a = routeInfo[i].pos, b = routeInfo[Math.min(i + 1, routeInfo.length - 1)].pos; const d = b.clone().sub(a); return (Math.abs(d.x) + Math.abs(d.z)) < 0.01 ? heading : Math.atan2(d.x, -d.z); }
function previewStep() {
  const p = preview, now = performance.now(), dt = Math.min(0.1, (now - p.last) / 1000); p.last = now;
  if (p.hold > 0) { p.hold -= dt; return; }
  if (p.i >= routeInfo.length - 1) { endPreview(); return; }
  const a = routeInfo[p.i].pos, b = routeInfo[p.i + 1].pos, L = Math.max(0.1, a.distanceTo(b));
  p.t += dt * 8 / L;
  heading = segYaw(p.i); gimbal = -20;
  if (p.t >= 1) {
    p.t = 0; p.i += 1; const w = routeInfo[p.i];
    drone.position.copy(w.pos); markPassed(p.i);
    if (w.yaw != null) heading = w.yaw;
    gimbal = w.pitch;
    p.hold = Math.max(w.hold > 0 ? 1.5 : 0.3, Math.min(3, w.hold));
  } else drone.position.copy(a).lerp(b, p.t);
  droneLine.geometry.setFromPoints([drone.position, new THREE.Vector3(drone.position.x, 0, drone.position.z)]);
  droneShadow.position.set(drone.position.x, 0.12, drone.position.z);
}
function endPreview() { preview = null; camMode = flying ? flightMode : 'orbit'; markers.forEach(m => m.material.opacity = 1); passed = 0; if (!flying) { drone.visible = false; droneLine.visible = droneShadow.visible = false; } }

function setFlying(f) { flying = !!f; if (flying) { if (preview) endPreview(); camMode = flightMode; } else if (camMode !== 'orbit') camMode = 'orbit'; }
function setDrone(x, y, z, hdg, pitch) {
  if (!scene) return;
  if (preview) endPreview();
  drone.visible = true; drone.position.set(x, y, -z);
  heading = hdg * Math.PI / 180; if (pitch != null) gimbal = pitch;
  droneLine.visible = true; droneLine.geometry.setFromPoints([drone.position, new THREE.Vector3(x, 0, -z)]);
  droneShadow.visible = true; droneShadow.position.set(x, 0.12, -z);
  for (let i = passed; i < routeInfo.length; i++) if (routeInfo[i].pos.distanceTo(drone.position) < 3) markPassed(i);
  const last = trailPts[trailPts.length - 1];
  if (!last || last.distanceTo(drone.position) > 0.5) { trailPts.push(drone.position.clone()); if (trailPts.length > 2000) trailPts.shift(); trail.geometry.setFromPoints(trailPts); }
}
function clearDrone() { if (drone && !preview) { drone.visible = false; droneLine.visible = false; droneShadow.visible = false; } }
// Kamera weiterschalten: Drohnensicht → Verfolger → Übersicht. Gibt den Namen zurück.
function cycleCamera() {
  const order = ['fpv', 'chase', 'orbit'];
  const cur = camMode === 'preview' ? flightMode : camMode;
  const next = order[(order.indexOf(cur) + 1) % order.length];
  yawOff = 0; pitchOff = 0;
  if (camMode === 'preview') { if (next === 'orbit') endPreview(); else flightMode = next; }
  else { camMode = next; if (next !== 'orbit') flightMode = next; }
  const names = { fpv: 'Drohnensicht', chase: 'Verfolger', orbit: 'Übersicht' };
  showLabel(names[next]); return next;
}
function setFollow(f) { camMode = f ? flightMode : 'orbit'; }
init();
