name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: APK bauen
        env:
          DJI_API_KEY: ${{ secrets.DJI_API_KEY }}
        run: ./gradlew :app:assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk felix-drohne-0.1.${{ github.run_number }}.apk
      - name: Als Release veröffentlichen (Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Felix Drohne 0.1.${{ github.run_number }}
          make_latest: true
          body: |
            Neueste App-Version. Auf dem Samsung diese Seite öffnen und die .apk antippen.
            App-Key gesetzt: ${{ secrets.DJI_API_KEY != '' && 'ja' || 'nein (Registrierung schlägt fehl, Rest testbar)' }}
          files: felix-drohne-0.1.${{ github.run_number }}.apk
