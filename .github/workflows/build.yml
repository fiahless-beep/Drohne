name: APK bauen

on:
  push:
    branches: [main]
    # Uploads der App (Fotos, Protokolle, Flugaufzeichnungen) lösen keinen Build aus.
    paths-ignore:
      - "fluege/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Gleicher Signierschlüssel für jede Version, damit Updates sich drüber installieren lassen.
      # Der Schlüssel liegt nur im Actions-Cache (nicht im öffentlichen Repo).
      - name: Signierschlüssel aus Cache
        id: signing
        uses: actions/cache@v4
        with:
          path: keystore/drohne.keystore
          key: drohne-signing-v2
      - name: Signierschlüssel einmalig erzeugen
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/drohne.keystore -storepass drohne-app -keypass drohne-app \
            -alias drohne -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Felix Drohne"
      - name: Signatur-Fingerabdruck
        run: keytool -list -keystore keystore/drohne.keystore -storepass drohne-app | grep -i sha
      - name: Gebäudedatenbank packen (falls plaene/daten/*.geojson vorhanden)
        run: |
          mkdir -p app/src/main/assets
          if ls plaene/daten/*.geojson >/dev/null 2>&1; then python3 tools/gebaeude_pack.py "plaene/daten/*.geojson" app/src/main/assets/gebaeude.bin; else echo "keine Gebäudedaten"; fi
      - name: "three.js für die 3D-Ansicht holen (sonst CDN im WebView)"
        run: |
          curl -fsSL -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js || echo "three.js nicht geladen"
          cp planer/index.html app/src/main/assets/google3d.html
      - name: "three.js als Build-Artefakt ablegen (für Rendertests)"
        uses: actions/upload-artifact@v4
        with:
          name: three-min-js
          path: app/src/main/assets/three.min.js
          if-no-files-found: ignore
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: APK bauen
        env:
          DJI_API_KEY: ${{ secrets.DJI_API_KEY }}
          DJI_API_KEY_SKYTAC: ${{ secrets.DJI_API_KEY_SKYTAC }}
        run: ./gradlew :app:assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk skytac-0.1.${{ github.run_number }}.apk
      # App-Bundle für die interne Teststrecke im Play Store (Felix 23.11.2026). Gleicher Schlüssel = Upload-Schlüssel.
      - name: App-Bundle bauen (Play Store)
        env:
          DJI_API_KEY: ${{ secrets.DJI_API_KEY }}
          DJI_API_KEY_SKYTAC: ${{ secrets.DJI_API_KEY_SKYTAC }}
        run: |
          ./gradlew :app:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab skytac-0.1.${{ github.run_number }}.aab
          ls -l skytac-0.1.${{ github.run_number }}.aab
      - name: Als Release veröffentlichen (Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skytac 0.1.${{ github.run_number }}
          make_latest: true
          body: |
            Neueste App-Version. Auf dem Samsung diese Seite öffnen und die .apk antippen.
            Paketname: ${{ secrets.DJI_API_KEY_SKYTAC != '' && 'app.skytac.pilot' || 'com.felixos.drohne (neuer DJI-Schlüssel fehlt noch)' }}
            App-Key gesetzt: ${{ secrets.DJI_API_KEY != '' && 'ja' || 'nein (Registrierung schlägt fehl, Rest testbar)' }}
          files: |
            skytac-0.1.${{ github.run_number }}.apk
            skytac-0.1.${{ github.run_number }}.aab
